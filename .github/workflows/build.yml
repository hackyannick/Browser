name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ g++-mingw-w64-i686

      - name: Engine unit tests (Linux)
        run: |
          cmake -S . -B build-linux -DCMAKE_BUILD_TYPE=Release
          cmake --build build-linux -j"$(nproc)"
          ./build-linux/kite-tests

      - name: Build kite.exe for Windows 2000
        run: ./build-win2k.sh

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Kite-Windows2000
          path: dist/Kite/
